name: Release APK

# Manual run only. Needs four repository secrets (Settings > Secrets and variables > Actions):
#   FLIPDAY_KEYSTORE_BASE64  the upload keystore, base64 encoded (base64 -w0 flipday-upload.jks)
#   FLIPDAY_KEYSTORE_PASSWORD, FLIPDAY_KEY_ALIAS, FLIPDAY_KEY_PASSWORD
on: workflow_dispatch

# Publishes a GitHub Release with the signed APK. The app's update check reads the latest release; its tag v0.1.<run number> carries the versionCode.
permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Decode keystore
        run: echo "${{ secrets.FLIPDAY_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed APK and bundle
        env:
          FLIPDAY_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          FLIPDAY_KEYSTORE_PASSWORD: ${{ secrets.FLIPDAY_KEYSTORE_PASSWORD }}
          FLIPDAY_KEY_ALIAS: ${{ secrets.FLIPDAY_KEY_ALIAS }}
          FLIPDAY_KEY_PASSWORD: ${{ secrets.FLIPDAY_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: flipday-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: flipday-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/*.apk "flipday-$VERSION.apk"
          gh release create "v$VERSION" "flipday-$VERSION.apk" --title "Flipday $VERSION" --notes "Signed APK. Flipday checks for this release twice a week and offers to install it." --latest
